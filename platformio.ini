; Kühlschrank-Monitor – ESP32 (ELEGOO ESP-32 / ESP32-WROOM-32 DevKit)
;
; Bauen:            pio run
; Flashen (USB):    pio run -t upload
; Serieller Monitor: pio device monitor
;
; Nach dem Bauen liegt zusätzlich ein Komplett-Image für den Browser-Flasher in
;   firmware/kuehlschrank-full.bin  (an Adresse 0x0 schreiben)
; und ein Update-Image für das Web-Update in
;   firmware/kuehlschrank-update.bin

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
extra_scripts = post:scripts/merge_bin.py

; Simulation in Wokwi (see wokwi.toml / diagram.json): joins the simulated
; network "Wokwi-GUEST" instead of opening the hotspot (Wokwi can't simulate it).
;   pio run -e esp32-sim   then start the simulator in VS Code (F1 > Wokwi: Start Simulator)
[env:esp32-sim]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DWOKWI_SIM
